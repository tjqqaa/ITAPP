components:
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        appointment_date:
          type: string
          format: date-time
        reason:
          type: string
        location:
          type: string
          nullable: true
          maxLength: 255
        type:
          $ref: '#/components/schemas/TypeEnum'
        state:
          $ref: '#/components/schemas/StateEnum'
        patient:
          type: integer
        doctor:
          type: integer
      required:
      - appointment_date
      - doctor
      - id
      - patient
      - reason
      - type
    Doctor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
        specialization:
          type: string
          maxLength: 100
        user:
          type: integer
      required:
      - birth_date
      - email
      - first_name
      - id
      - last_name
      - phone_number
      - specialization
      - user
      - username
    DoctorRegister:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
          maxLength: 15
        first_name:
          type: string
        last_name:
          type: string
        specialization:
          type: string
          maxLength: 100
      required:
      - birth_date
      - email
      - first_name
      - last_name
      - password
      - phone_number
      - specialization
      - username
    Medication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        dosage:
          type: string
          maxLength: 100
        patient:
          type: integer
      required:
      - dosage
      - id
      - name
      - patient
    Patient:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
        mood:
          type: string
          maxLength: 100
        emergency_contact:
          type: string
          maxLength: 15
        health_points:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
        user:
          type: integer
        doctor:
          type: integer
          nullable: true
      required:
      - birth_date
      - email
      - emergency_contact
      - first_name
      - health_points
      - id
      - last_name
      - mood
      - phone_number
      - user
      - username
    PatientRegister:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
        email:
          type: string
          format: email
        birth_date:
          type: string
          format: date
        phone_number:
          type: string
          maxLength: 15
        first_name:
          type: string
        last_name:
          type: string
        mood:
          type: string
          maxLength: 100
        emergency_contact:
          type: string
          maxLength: 15
        health_points:
          type: integer
        doctor:
          type: integer
          nullable: true
      required:
      - birth_date
      - email
      - emergency_contact
      - first_name
      - health_points
      - last_name
      - mood
      - password
      - phone_number
      - username
    StateEnum:
      enum:
      - pending
      - confirmed
      - cancelled
      - completed
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `cancelled` - Cancelled
        * `completed` - Completed
    TypeEnum:
      enum:
      - inPerson
      - online
      type: string
      description: |-
        * `inPerson` - In Person
        * `online` - Online
    User:
      type: object
      properties:
        username:
          type: string
          description: Required. 150 characters or fewer. Letters, digits and @/./+/-/_
            only.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        password:
          type: string
          maxLength: 128
      required:
      - password
      - username
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
